name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv venv && uv pip install -e ".[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check --output-format github .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGLQ_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv venv && uv pip install -e ".[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: tests
        run: pytest -q -m "not chaos" -rs --cov=pglq --cov-report=term | tee out.txt
      - name: no test may skip for lack of a database
        run: "! grep -q SKIPPED out.txt"
      - name: kill -9 chaos test and its control
        run: pytest -q -s -m chaos

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
